baseURL = 'https://salva989.github.io/blog-di-salva/'
languageCode = 'it-IT'
defaultContentLanguage = 'it'
title = 'Il blog di Salva'
theme = 'PaperMod'
enableRobotsTXT = true

[params]
  # Basic configuration
  env = "production"
  description = "Appunti su tecnologia, cinema, videogiochi, cultura e vita quotidiana."
  author = "Salva989"
  mainSections = ["posts"]
  images = ["https://avatars.githubusercontent.com/u/179056148?v=4"]
  
  # Theme-specific settings
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

[params.profileMode]
  enabled = true 
  title = "Ciaooo 👋"
  subtitle = "Benvenuto forestiero!"
  imageUrl = "https://avatars.githubusercontent.com/u/179056148?v=4"
  imageWidth = 120
  imageHeight = 120

[params.cover]
  linkFullImages = true
  responsiveImages = true

[params.homeInfoParams]
  Title = "Ciaoo 👋"
  Content = "Benvenuto forestiero!"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Salva989/"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 20
    
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
